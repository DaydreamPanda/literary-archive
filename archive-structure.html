<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>章节工作台 · 私人文学档案馆</title>
<link rel="stylesheet" href="/archive.css">
<link rel="stylesheet" href="/archive-structure-studio.css">
<script defer src="/archive-structure-admin.js"></script>
</head>
<body>
<header class="site-head"><a class="site-identity" href="/index.html"><span class="site-seal">文</span><span><span class="site-name">私人文学档案馆</span><span class="site-kicker">CHAPTER STUDIO</span></span></a><nav class="site-nav"><a href="/admin.html">作者后台</a><a href="/index.html">网站首页</a></nav></header>
<main class="studio-shell">
  <div class="studio-top">
    <div><div class="eyebrow">AUTHOR TOOLS / 写作工作台</div><h1>章节管理</h1><p class="studio-muted">一处整理章与节、调整阅读顺序，以及编辑或导出正文。</p></div>
    <div class="studio-head-actions"><button id="save-structure" class="studio-btn primary" disabled>保存目录与标题</button><span id="save-state" class="studio-save-state">读取中…</span></div>
  </div>
  <div class="studio-picker">
    <label for="structure-book">当前作品</label>
    <select id="structure-book" aria-label="选择作品"></select>
    <a id="new-chapter" class="studio-btn soft" href="/admin.html">＋ 新增章节</a>
    <button id="export-book" class="studio-btn soft" type="button">导出全书 TXT</button>
    <a id="structure-preview" class="studio-link" href="/index.html" target="_blank" rel="noopener noreferrer">查看公开目录 ↗</a>
  </div>
  <div id="structure-status" class="studio-notice" role="status" aria-live="polite">正在检查登录状态…</div>
  <section id="structure-tools" class="studio-workspace" hidden>
    <div class="studio-panel studio-tree-panel">
      <div class="studio-panel-head"><div><h2>章与节</h2><p class="studio-muted"><span id="chapter-count">0</span> 个正文单元 · 拖动左侧手柄排序</p></div><button id="toggle-organize" class="studio-btn soft" type="button">多选整理</button></div>
      <div class="studio-filter"><input id="chapter-search" type="search" placeholder="搜索标题（搜索时暂停拖动）" aria-label="搜索章节"><span id="search-hint"></span></div>
      <div id="selection-panel" class="studio-selection" hidden>
        <p id="selected-count">已选 0 篇</p>
        <div class="studio-merge-form"><input id="merge-title" type="text" maxlength="200" placeholder="合并后的大章名称"><button id="merge-selected" class="studio-btn primary" type="button">合并所选</button></div>
        <div class="studio-inline-actions"><button id="split-selected" class="studio-btn soft" type="button">拆分选中</button><button id="delete-selected" class="studio-btn danger" type="button">删除选中</button><button id="select-all" class="studio-btn soft" type="button">全选可见</button><button id="cancel-organize" class="studio-btn ghost" type="button">完成整理</button></div>
      </div>
      <div id="chapter-tree" class="studio-tree" aria-label="章节目录"></div>
      <div class="studio-tree-foot">修改暂存在本页面。确认后点击顶部「保存目录与标题」。</div>
    </div>
    <aside class="studio-panel studio-inspector">
      <div class="studio-panel-head"><h2>详情</h2><span class="studio-muted">选中左侧内容</span></div>
      <div id="inspector-content" class="studio-inspector-content"><div class="studio-empty">点击一个大章或小节，在这里修改标题和归属。</div></div>
    </aside>
  </section>
  <div class="studio-bottom"><button id="reload-structure" class="studio-btn soft" type="button" hidden>放弃未保存修改，重新加载</button><span id="structure-summary" class="studio-muted"></span></div>
</main>
</body>
</html>
